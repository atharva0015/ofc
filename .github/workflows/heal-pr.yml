name: heal-pr

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  unit-tests:
    if: contains(github.event.pull_request.labels.*.name, 'auto-heal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: make lint
      - run: make test

  healed-on-staging:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: python -m scripts.bench_verify

  stability:
    needs: healed-on-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: 5 consecutive passes
        run: |
          for i in 1 2 3 4 5; do python -m pytest tests/test_orchestrator.py -q || exit 1; done

  negative-check:
    # The healed test must FAIL against a seeded-defect build,
    # proving the heal is not vacuous.
    needs: stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Seeded defect must fail
        run: |
          DRIFT_MODE=removed_element python -m pytest benchmark/test_demo.py -q -k "submit or checkout" && exit 1 || exit 0

  secret-scan:
    # Runs on every PR, not only auto-heal PRs, so a leaked credential cannot
    # ride an ordinary change past the scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (sha256 pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Prove the scanner catches a seeded secret
        run: python -m scripts.secret_scan --self-test
      - name: Scan git history
        run: python -m scripts.secret_scan

  policy-check:
    needs: [negative-check, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Self-approval never counts
        run: python -m pytest tests/test_gitops_e2e.py -q -k "review"
