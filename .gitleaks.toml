# Gitleaks configuration for the self-healing framework.
#
# The previous CI job used a grep pattern; it could not tell a credential from
# a variable name and it ignored history. This config extends gitleaks' default
# rule set (AWS, GitHub, Slack, private keys, JWTs, generic high-entropy keys)
# and only allowlists generated or vendored paths that are never source.
#
# Run locally with:
#   python -m scripts.secret_scan            # git history
#   python -m scripts.secret_scan --mode dir # current working tree
#
# Install gitleaks 8.30.1 and put it on PATH, or set GITLEAKS_BIN.

title = "Self-healing framework secret scan"

[extend]
useDefault = true

[allowlist]
description = "Local virtualenvs, build output, and vendored dependencies are not source."
paths = [
  '''(^|[\\/])\.venv(312)?[\\/]''',
  '''(^|[\\/])(venv|dist|build|node_modules)[\\/]''',
]
